[package]
name = "openl7"
version = "0.2.0"
edition = "2021"
description = "Linux tray app, settings window and CLI for the MCHOSE L7 Pro mouse"
license = "MIT"

[dependencies]
ksni = { version = "0.3", features = ["blocking"] }
libc = "0.2"
eframe = "0.31"

[profile.release]
strip = true
lto = true
